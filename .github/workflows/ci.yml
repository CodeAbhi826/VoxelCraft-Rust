name: CI

# Automated test matrix: every push (any branch) + every PR to main.
# Complements wasm-build.yml (which deploys the WASM bundle to public/):
# this workflow is the quality GATE — the whole library workspace
# (14 vc-* crates + the app) is tested: native tests, wasm check,
# native check with audio, and the headless benchmark, on the code that ships.
# fmt/clippy close the style-gap drift: rustfmt 1.9.0 reflowed the tree
# (2026-10-01) and neither gate ran anywhere before this.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: legal audit (trademark / forbidden files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: legal_audit.py (LEGAL-COMPLIANCE.md §6 — must print [PASS])
        run: python3 scripts/legal_audit.py

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check (whole workspace)
        working-directory: voxelcraft
        run: cargo fmt --check

  tests:
    name: cargo test (ubuntu, headless-safe)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: voxelcraft
          key: ci-test

      - name: Show toolchain
        run: |
          cargo --version
          rustc --version

      - name: cargo test (whole workspace — 14 libraries + app)
        working-directory: voxelcraft
        run: cargo test --release --no-default-features --workspace

      - name: cargo check (native, audio on)
        working-directory: voxelcraft
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev
          cargo check --release --workspace

  # 1.0.2 (PLAN v3.1): the R5 determinism gate — the worldgen golden hash
  # (vc-world::gen::golden_determinism_tests) must be bit-identical on
  # Linux, Windows and macOS. Only this ONE test runs on the extra legs
  # (the full suite stays ubuntu-only, as the owner specified). The test
  # binary builds fast (vc-world + its deps, no app crate).
  golden-hash:
    name: worldgen golden hash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: voxelcraft
          key: ci-golden-${{ matrix.os }}

      - name: Run the golden worldgen hash test ONLY
        working-directory: voxelcraft
        shell: bash
        run: |
          cargo test -p vc-world --lib golden_determinism -- --nocapture 2>&1 | tee golden.log
          test "${PIPESTATUS[0]:-0}" -eq 0 || exit 1
          grep -q "test result: ok" golden.log || { echo "FAIL: golden hash test did not pass"; exit 1; }
          grep -c "GOLDEN seed=" golden.log | grep -q "^9$" || { echo "FAIL: expected 9 GOLDEN hash lines"; exit 1; }
          echo "GOLDEN HASH OK on ${{ matrix.os }} — all 9 neighborhood hashes bit-identical to the pinned values"

  wasm:
    name: cargo check (wasm32, lib)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: voxelcraft
          key: ci-wasm

      - name: cargo check (wasm32 — every library + the app lib)
        working-directory: voxelcraft
        run: cargo check --release --no-default-features --workspace --lib --target wasm32-unknown-unknown

      - name: cargo compile-check (wasm32 unit tests — headless-safe subset, --no-run)
        working-directory: voxelcraft
        run: cargo test --no-default-features --workspace --lib --target wasm32-unknown-unknown --no-run

  clippy:
    name: cargo clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: voxelcraft
          key: ci-clippy

      - name: Install ALSA headers (audio feature)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: cargo clippy (-D warnings — whole workspace, audio on)
        working-directory: voxelcraft
        run: cargo clippy -- -D warnings

  bench:
    name: headless benchmark (§37/§48 baselines)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: voxelcraft
          key: ci-bench

      - name: Headless CPU-pipeline benchmark
        working-directory: voxelcraft
        run: |
          cargo run --release --no-default-features --features bench-bin --bin vc_bench -- \
            chunks=96 json=bench-headless.json
          echo "=== bench-headless.json ==="
          cat bench-headless.json

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: ci-bench-json
          path: voxelcraft/bench-headless.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload the vc_bench binary (the reference hardware baseline tier runs it locally)
        uses: actions/upload-artifact@v4
        with:
          name: ci-bench-binary
          path: voxelcraft/target/release/vc_bench
          retention-days: 30
          if-no-files-found: error

  licenses:
    name: license gates (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cargo-deny check licenses (deny.toml — GPL-incompatible dep fails)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: voxelcraft/Cargo.toml
          command: check licenses
