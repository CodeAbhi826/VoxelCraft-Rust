name: Linux Game (single file)

# THE GAME as one self-contained Linux x86_64 executable.
#
#   voxelcraft-<ref>-linux-x64  —  the whole engine with the builtin
#   resource pack EMBEDDED in the binary (crates/voxelcraft/build.rs),
#   so it runs directly:
#
#       chmod +x voxelcraft-*-linux-x64
#       ./voxelcraft-*-linux-x64
#
#   No crates to download, no pack folder, no Rust toolchain, no build
#   step. (The per-library source archives live in release.yml — this
#   workflow is only the game.)
#
# Triggers:
#   * workflow_dispatch  — manual "run the actions" build
#   * push to main that touches Rust code / this workflow
#   * workflow_call      — release.yml reuses this job so every GitHub
#                          Release also carries the single-file game
#
# Built on ubuntu-22.04 (glibc 2.35) so the binary also runs on Debian 12+,
# Ubuntu 22.04+, Fedora 36+, Arch, etc. — not just the newest runners.

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'voxelcraft/**'
      - '.github/workflows/linux-game.yml'

permissions:
  contents: read

concurrency:
  group: linux-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-file:
    name: build the single-file Linux game (x86_64, pack embedded)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: voxelcraft
          key: linux-single

      - name: Install ALSA headers (full audio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build release binary (builtin pack embedded by build.rs)
        working-directory: voxelcraft
        run: cargo build --release -p voxelcraft --bin voxelcraft

      - name: Name + verify the artifact
        working-directory: voxelcraft
        run: |
          set -euo pipefail
          # tag builds (via release.yml) name after the tag; branch builds
          # after main-<short sha>
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            BIN_NAME="voxelcraft-${GITHUB_REF_NAME}-linux-x64"
          else
            BIN_NAME="voxelcraft-main-${GITHUB_SHA:0:12}-linux-x64"
          fi
          echo "BIN_NAME=$BIN_NAME" >> "$GITHUB_ENV"
          cp target/release/voxelcraft "../$BIN_NAME"
          chmod +x "../$BIN_NAME"
          cd ..
          ls -la "$BIN_NAME"
          # 1. it must be a real x86_64 ELF executable
          file "$BIN_NAME"
          # 2. the builtin pack must be INSIDE the binary (build.rs embed):
          #    the pack.mcmeta description string is baked into .rodata
          grep -a -o -m1 "VoxelCraft builtin pack" "$BIN_NAME" \
            || { echo "FAIL: embedded-pack marker not found in the binary"; exit 1; }
          # 3. show the shared-library surface (informational — every
          #    desktop Linux ships these: glibc, X11/Wayland, ALSA)
          ldd "$BIN_NAME" || true
          # 4. size summary
          echo "single-file game: $(du -h "$BIN_NAME" | cut -f1) — $BIN_NAME"

      - name: Smoke-test the executable (headless boot → world entry)
        # BLOCKING-BUG REGRESSION GUARD: the first live runner of this
        # binary sat on "Building terrain…" forever (loading timeout was
        # unreachable with 0 GPU chunks — fixed in game.rs; GPU-mesher
        # readback stall watchdog in gpu_mesh.rs). The build used to stop
        # at file/ldd checks and never RAN the game it shipped; now the
        # binary must boot headless on lavapipe (software Vulkan under
        # Xvfb), run the REAL startup path — intro (asset bar) → title
        # (pre-rendered panorama, no world gen) → world entry through the
        # loading gate → gameplay — and exit 0 via --smoke.
        run: |
          # headless graphics stack: Xvfb (X11) + lavapipe (software
          # Vulkan ICD — wgpu's native path; compute included, so the GPU
          # mesh pipeline is exercised too) + the mesa GL/EGL fallback
          # stack and winit's X11 keyboard libs. Desktops ship all of
          # this; the minimal runner image does not (the first smoke
          # runs caught libxkbcommon-x11 and the surface/ICD gap).
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxkbcommon0 \
            libgl1 libgl1-mesa-dri libegl-mesa0 libglx-mesa0 \
            libvulkan1 mesa-vulkan-drivers
          set -euo pipefail
          set +e
          timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" \
            env WGPU_BACKEND=Vulkan E2E_V114=1 \
            "./$BIN_NAME" --smoke 2>&1 | tee smoke.log
          CODE=$?
          set -e
          echo "smoke exit code: $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "FAIL: binary did not reach gameplay cleanly (see log above)"
            exit 1
          fi
          grep -q "intro complete" smoke.log
          grep -q "smoke: title reached" smoke.log
          grep -qE "loading (complete|timeout)" smoke.log
          grep -q "smoke: game entered" smoke.log
          # pointer-capture ladder engaged on the way in (Locked/Confined/
          # Delta-look - any of the three; the pre-fix bug was a blind
          # grab that left an invisible dead cursor on lock-less compositors)
          grep -q "pointer:" smoke.log
          # 1.14 nature-half regression guard: the E2E_V114 sequence ran at
          # world entry (campfire + barrel + bush + shoot + fox placed, the
          # 650-tick fast-forward completed the 600-tick campfire cook)
          grep -q "e2e: v114 campfire lit+fed=true" smoke.log
          grep -q "e2e: v114 campfire cooked 1 item(s)" smoke.log
          echo "SMOKE OK - pointer ladder + boot + world entry + 1.14 nature-half all verified"

          # F3 debug overlay regression guard (user-reported "everything in
          # F3 was static"): same binary, FRESH directory (also proves the
          # first-run profile bootstrap - "assets get created when we run
          # the game"), overlay forced on, two PNG dumps ~1 s apart.
          # The pair MUST differ (fps/XYZ/light/memory are all live) and
          # the vanilla-profile folder structure MUST materialize.
          mkdir -p run2 && pushd run2 >/dev/null
          set +e
          timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" \
            env WGPU_BACKEND=Vulkan F3=1 F3_DUMP=f3a.png F3_DUMP2=f3b.png \
            "../$BIN_NAME" --smoke 2>&1 | tee ../smoke-f3.log
          CODE=$?
          set -e
          popd >/dev/null
          echo "f3 smoke exit code: $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "FAIL: F3 smoke run exited $CODE"
            exit 1
          fi
          grep -q "F3 liveness pair written" smoke-f3.log
          if cmp -s run2/f3a.png run2/f3b.png; then
            echo "FAIL: F3 overlay is STATIC (the two dumps are identical)"
            exit 1
          fi
          echo "F3 overlay LIVE - the two dumps differ"
          for f in builtin-pack/pack.mcmeta options.txt logs/latest.log \
                   saves resourcepacks shader-packs; do
            test -e "run2/$f" || { echo "FAIL: first-run $f did not materialize"; exit 1; }
          done
          echo "FIRST-RUN OK - running the game creates its profile folder (builtin-pack extracted, options.txt, logs/latest.log)"
          echo "SMOKE OK — the single-file binary boots (intro → panorama title) and enters a world headless (lavapipe)"

      - name: Upload artifact (the raw executable, no archive)
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-linux-single-file
          path: voxelcraft-*-linux-x64
          retention-days: 90
          if-no-files-found: error
