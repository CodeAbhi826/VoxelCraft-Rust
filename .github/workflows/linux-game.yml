name: Linux Game (single file)

# THE GAME as one self-contained Linux x86_64 executable.
#
#   voxelcraft-<ref>-linux-x64  —  the whole engine with the builtin
#   resource pack EMBEDDED in the binary (crates/voxelcraft/build.rs),
#   so it runs directly:
#
#       chmod +x voxelcraft-*-linux-x64
#       ./voxelcraft-*-linux-x64
#
#   No crates to download, no pack folder, no Rust toolchain, no build
#   step. (The per-library source archives live in release.yml — this
#   workflow is only the game.)
#
# Triggers:
#   * workflow_dispatch  — manual "run the actions" build
#   * push to main that touches Rust code / this workflow
#   * workflow_call      — release.yml reuses this job so every GitHub
#                          Release also carries the single-file game
#
# Built on ubuntu-22.04 (glibc 2.35) so the binary also runs on Debian 12+,
# Ubuntu 22.04+, Fedora 36+, Arch, etc. — not just the newest runners.

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'voxelcraft/**'
      - '.github/workflows/linux-game.yml'

permissions:
  contents: read

concurrency:
  group: linux-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-file:
    name: build the single-file Linux game (x86_64, pack embedded)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: voxelcraft
          key: linux-single

      - name: Install ALSA headers (full audio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build release binary (builtin pack embedded by build.rs)
        working-directory: voxelcraft
        run: cargo build --release -p voxelcraft --bin voxelcraft

      - name: Name + verify the artifact
        working-directory: voxelcraft
        run: |
          set -euo pipefail
          # tag builds (via release.yml) name after the tag; branch builds
          # after main-<short sha>
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            BIN_NAME="voxelcraft-${GITHUB_REF_NAME}-linux-x64"
          else
            BIN_NAME="voxelcraft-main-${GITHUB_SHA:0:12}-linux-x64"
          fi
          echo "BIN_NAME=$BIN_NAME" >> "$GITHUB_ENV"
          cp target/release/voxelcraft "../$BIN_NAME"
          chmod +x "../$BIN_NAME"
          cd ..
          ls -la "$BIN_NAME"
          # 1. it must be a real x86_64 ELF executable
          file "$BIN_NAME"
          # 2. the builtin pack must be INSIDE the binary (build.rs embed):
          #    the pack.json description string is baked into .rodata
          grep -a -o -m1 "VoxelCraft builtin pack" "$BIN_NAME" \
            || { echo "FAIL: embedded-pack marker not found in the binary"; exit 1; }
          # 3. show the shared-library surface (informational — every
          #    desktop Linux ships these: glibc, X11/Wayland, ALSA)
          ldd "$BIN_NAME" || true
          # 4. size summary
          echo "single-file game: $(du -h "$BIN_NAME" | cut -f1) — $BIN_NAME"

      - name: Smoke-test the executable (headless boot → world entry)
        # BLOCKING-BUG REGRESSION GUARD: the first live runner of this
        # binary sat on "Building terrain…" forever (loading timeout was
        # unreachable with 0 GPU chunks — fixed in game.rs; GPU-mesher
        # readback stall watchdog in gpu_mesh.rs). The build used to stop
        # at file/ldd checks and never RAN the game it shipped; now the
        # binary must boot headless on lavapipe (software Vulkan under
        # Xvfb), run the REAL startup path — intro (asset bar) → title
        # (pre-rendered panorama, no world gen) → world entry through the
        # loading gate → gameplay — and exit 0 via --smoke.
        run: |
          # headless graphics stack: Xvfb (X11) + lavapipe (software
          # Vulkan ICD — wgpu's native path; compute included, so the GPU
          # mesh pipeline is exercised too) + the mesa GL/EGL fallback
          # stack and winit's X11 keyboard libs. Desktops ship all of
          # this; the minimal runner image does not (the first smoke
          # runs caught libxkbcommon-x11 and the surface/ICD gap).
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxkbcommon0 \
            libgl1 libgl1-mesa-dri libegl-mesa0 libglx-mesa0 \
            libvulkan1 mesa-vulkan-drivers
          set -euo pipefail
          set +e
          timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" \
            env WGPU_BACKEND=Vulkan E2E_V114=1 E2E_V115=1 E2E_V116=1 \
            "./$BIN_NAME" --smoke --verbose 2>&1 | tee smoke.log
          CODE=$?
          set -e
          echo "smoke exit code: $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "FAIL: binary did not reach gameplay cleanly (see log above)"
            exit 1
          fi
          grep -q "intro complete" smoke.log
          grep -q "smoke: title reached" smoke.log
          grep -qE "loading (complete|timeout)" smoke.log
          grep -q "smoke: game entered" smoke.log
          # --verbose regression guard: the raw diagnostic stream engaged and
          # produced its categories (screen transitions, input routing, the
          # 1 Hz perf heartbeat, the exit summary) — the bug-report channel
          grep -q "raw debug stream enabled (--verbose)" smoke.log
          grep -q "\[screen\] intro -> title" smoke.log
          grep -q "\[input\] click left down" smoke.log
          grep -q "\[perf\] fps" smoke.log
          grep -q "\[exit\] uptime" smoke.log
          # pointer-capture ladder engaged on the way in (Locked/Confined/
          # Delta-look - any of the three; the pre-fix bug was a blind
          # grab that left an invisible dead cursor on lock-less compositors)
          grep -q "pointer:" smoke.log
          # 1.14 nature-half regression guard: the E2E_V114 sequence ran at
          # world entry (campfire + barrel + bush + shoot + fox placed, the
          # 650-tick fast-forward completed the 600-tick campfire cook)
          grep -q "e2e: v114 campfire lit+fed=true" smoke.log
          grep -q "e2e: v114 campfire cooked 1 item(s)" smoke.log
          # 1.14 part-2 (smelting trio + lantern): the blast furnace's
          # 100-tick 2x ore cook, the smoker's 100-tick food cook, the
          # lantern's sitting/hanging states + light, the support pop
          grep -q "e2e: v114b blast furnace out=1 lit=true" smoke.log
          grep -q "e2e: v114b blast furnace out=1 lit=true (100-tick 2x cook), smoker out=1" smoke.log
          grep -q "e2e: v114b hanging lantern popped on support break=true" smoke.log
          # 1.14 part-3 (flowers): planted on grass, F3 lines decode, the
          # blue/white dye crafts resolve, instant-break holds
          grep -q "e2e: v114c flowers planted=true" smoke.log
          grep -q 'f3-corn="Cornflower" f3-lily="Lily of the Valley"' smoke.log
          grep -q "e2e: v114c flowers planted=true f3-corn" smoke.log
          grep -q "blue-dye=true white-dye=true instant-break=true" smoke.log
          # 1.15 (Buzzy Bees) regression guard: the hive lifecycle ran at
          # world entry (level states fold + re-encode, all five crafts
          # resolve, the nectar bee entered the hive, worked 2400 ticks,
          # exited with the honey bump, the lit campfire pacifies, the
          # anger swarm arms)
          grep -q "e2e: v115 hive level0=0 level5=5 full=true" smoke.log
          grep -q "crafts=true" smoke.log
          grep -q "lifecycle=true" smoke.log
          grep -q "campfire-pacify=true" smoke.log
          # 1.16 (Nether Update, part 1): the anchor family — the charge
          # ladder + respawn drain, the target's hit pulse (wire feed at
          # 11, decay to 0), the six craft contracts, the smelting path,
          # the nugget drop rolls, and the 2 HP/0.5 s soul-fire rate
          grep -q "e2e: v116 anchor=true" smoke.log
          grep -q "ladder=true" smoke.log
          grep -q "drain=true" smoke.log
          grep -q "decay=true" smoke.log
          grep -q "spiritfire-dmg=2.0" smoke.log
          # 1.16 (Nether Update, part 2): the forest families — the V14
          # registry + placement, the soul-lantern pair, the soul
          # lights, the family crafts, the strider's lava physics, the
          # hoglin's warped-fungus flee, the piglin barter + the
          # gold-mining anger
          grep -q "e2e: v116b family=true" smoke.log
          grep -q "lantern-pair=true" smoke.log
          grep -q "strider-lava=true" smoke.log
          grep -q "hoglin-flee=true" smoke.log
          grep -q "barter=true" smoke.log
          # the 1.0-1.16.5 completeness audit: the cooked-meat smelting
          # class, the kitchen crafts, the purpur chain, the audit trio
          # (the ghast's fireball + the cave spider's venom), and the
          # new food rows
          grep -q "e2e: audit16 smelt=true smoker=true kitchen=true purpur=true trio=true food=true" smoke.log
          grep -q "e2e: audit16b food=true melon=true golden=true throw=true hatch=true chorus=true" smoke.log

          # the vanilla settings-tree E2E: click through Options → Video /
          # Engine / Packs / Accessibility via the REAL input path and
          # round-trip back to the title (the exact-screen replication guard)
          set +e
          timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" \
            env WGPU_BACKEND=Vulkan E2E_MENU=1 \
            "./$BIN_NAME" --smoke --verbose 2>&1 | tee menu.log
          CODE=$?
          set -e
          echo "menu smoke exit code: $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "FAIL: settings-tree E2E did not round-trip cleanly (see menu.log)"
            exit 1
          fi
          grep -q "running the settings-tree E2E" menu.log
          grep -q "\[screen\] title -> options" menu.log
          grep -q "\[screen\] options -> video" menu.log
          grep -q "\[screen\] options -> engine" menu.log
          grep -q "\[screen\] options -> packs" menu.log
          grep -q "\[screen\] options -> access" menu.log
          # 2026-09-20: the Shaders screen leg — enter from Video, DONE
          # back to Video (the smoke script clicks the labPBR toggle +
          # the (none) row in between)
          grep -q "\[screen\] video -> shaders" menu.log
          grep -q "\[screen\] shaders -> video" menu.log
          # 2026-09-25: the Music & Sound leg — the 10-slider screen via
          # the real input path (a MUSIC slider click resets it to 1.0)
          grep -q "\[screen\] options -> musicsound" menu.log
          grep -q "\[screen\] musicsound -> options" menu.log
          # L5: the About screen leg — ABOUT... 5th title row, PNG
          # capture, DONE2 back (V1 visual for the licensing About page)
          grep -q "\[screen\] title -> about" menu.log
          grep -q "\[screen\] about -> options" menu.log
          grep -q "e2e: about screen captured" menu.log
          grep -q "ABOUT VERDICT OK" menu.log
          test -s screenshots/e2e_about.png || { echo "FAIL: about screen capture missing"; exit 1; }
          grep -q "e2e: settings tree ok (video/engine/shaders/packs/access/musicsound)" menu.log
          echo "SMOKE OK - pointer ladder + boot + world entry + 1.14 nature-half + settings tree all verified"

          # 2026-09-25: the NATIVE block-entity container screens (chest +
          # furnace) — the open:<container> commands are wasm-only, so
          # this E2E_CONTAINERS stage is the native leg: real
          # open_container path, vanilla-grey 9-slice panel asserted on
          # the GPU quad layer, canvas-fallback PNG dumps written.
          set +e
          timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" \
            env WGPU_BACKEND=Vulkan E2E_CONTAINERS=1 \
            CONTAINER_DUMP_CHEST=run-chest.png CONTAINER_DUMP_FURNACE=run-furnace.png \
            "./$BIN_NAME" --smoke --verbose 2>&1 | tee containers.log
          CODE=$?
          set -e
          echo "containers smoke exit code: $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "FAIL: container-screen E2E did not exit cleanly (see containers.log)"
            exit 1
          fi
          grep -q "e2e: containers chest geom(27+36)=true" containers.log
          grep -q "chrome=true" containers.log
          grep -q "furnace slots=true" containers.log
          test -s run-chest.png || { echo "FAIL: chest dump missing"; exit 1; }
          test -s run-furnace.png || { echo "FAIL: furnace dump missing"; exit 1; }
          echo "CONTAINERS OK - native chest + furnace screens: geometry, grey 9-slice chrome, PNG dumps"

          # F3 debug overlay regression guard (user-reported "everything in
          # F3 was static"): same binary, FRESH directory (also proves the
          # first-run profile bootstrap - "assets get created when we run
          # the game"), overlay forced on, two PNG dumps ~1 s apart.
          # The pair MUST differ (fps/XYZ/light/memory are all live) and
          # the vanilla-profile folder structure MUST materialize.
          mkdir -p run2 && pushd run2 >/dev/null
          set +e
          timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" \
            env WGPU_BACKEND=Vulkan F3=1 F3_DUMP=f3a.png F3_DUMP2=f3b.png \
            "../$BIN_NAME" --smoke 2>&1 | tee ../smoke-f3.log
          CODE=$?
          set -e
          popd >/dev/null
          echo "f3 smoke exit code: $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "FAIL: F3 smoke run exited $CODE"
            exit 1
          fi
          grep -q "F3 liveness pair written" smoke-f3.log
          if cmp -s run2/f3a.png run2/f3b.png; then
            echo "FAIL: F3 overlay is STATIC (the two dumps are identical)"
            exit 1
          fi
          echo "F3 overlay LIVE - the two dumps differ"
          # 2026-09-24: the pack descriptor is pack.json (this project's own
          # clean-room namespace — no third-party pack.mcmeta), verified live:
          # the boot log extracts all 16 embedded files on first run.
          for f in builtin-pack/pack.json options.txt logs/latest.log \
                   saves resourcepacks shader-packs; do
            test -e "run2/$f" || { echo "FAIL: first-run $f did not materialize"; exit 1; }
          done
          echo "FIRST-RUN OK - running the game creates its profile folder (builtin-pack extracted, options.txt, logs/latest.log)"

          # Round A: the F-KEY CONTRACT (E2E_FKEYS=1) — every function key
          # through the real key_action path: F1 HUD toggle, F5 perspective
          # cycle (0→1→2→0), F3+G chunk borders on→off, F11 fullscreen
          # on→off, F2 arms the swapchain readback whose PNG lands the next
          # frame (verified non-trivial, saved to screenshots/).
          mkdir -p run3 && pushd run3 >/dev/null
          set +e
          timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" \
            env WGPU_BACKEND=Vulkan E2E_FKEYS=1 \
            "../$BIN_NAME" --smoke --verbose 2>&1 | tee ../smoke-fkeys.log
          CODE=$?
          set -e
          popd >/dev/null
          echo "fkeys smoke exit code: $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "FAIL: F-key contract E2E exited $CODE"
            exit 1
          fi
          grep -q "e2e: fkeys keys ok" smoke-fkeys.log
          grep -q "FKEY CONTRACT OK" smoke-fkeys.log
          grep -q "e2e: fkeys behind view saved" smoke-fkeys.log
          grep -q "e2e: fkeys front view saved" smoke-fkeys.log
          # T5 contract (2026-10-01): the border lines must be VISIBLE in
          # the frame — the ladder pixel-diffs the borders-ON behind
          # capture against a borders-OFF one (the old flag-only contract
          # is how the collapsed-overlay bug shipped: flags armed, zero
          # border lines rendered)
          grep -q "border-visibility .* VISIBLE (contract ok)" smoke-fkeys.log || { echo "FAIL: border lines NOT VISIBLE in the capture (T5 contract)"; exit 1; }
          test -s run3/screenshots/e2e_fkeys_behind_*.png || { echo "FAIL: behind-view screenshot missing"; exit 1; }
          test -s run3/screenshots/e2e_fkeys_front_*.png || { echo "FAIL: front-view screenshot missing"; exit 1; }
          echo "FKEYS OK - F1/F2/F5/F3+G/F11 verified through the real input path (both F5 views captured, border lines pixel-verified)"

          # Beds round: the sleep-interaction leg (E2E_BEDS=1) — the REAL
          # use_bed() gates run in-game (the monster/window/distance
          # refusals, the night skip + the weather reset + the spawn set,
          # the respawn arm both branches). The unguarded first-update run
          # placed no bed and failed 5 of 7 flags silently — the leg now
          # waits for world entry + the chunks it touches, and the VERDICT
          # line is the gated contract.
          mkdir -p run4 && pushd run4 >/dev/null
          set +e
          timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" \
            env WGPU_BACKEND=Vulkan E2E_BEDS=1 \
            "../$BIN_NAME" --smoke 2>&1 | tee ../smoke-beds.log
          CODE=$?
          set -e
          popd >/dev/null
          echo "beds smoke exit code: $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "FAIL: beds E2E exited $CODE"
            exit 1
          fi
          grep -q "e2e: beds VERDICT OK" smoke-beds.log || { echo "FAIL: the beds E2E verdict is not OK (the flags line above shows which gate failed)"; exit 1; }
          echo "BEDS OK - the sleep gates verified in-game (monster/window/distance refusals, the night skip, the respawn arm)"

          # Fluids round: the in-game fluids leg (E2E_FLUIDS=1) — the REAL
          # fluid ticks through the sim's scheduler (the infinite water
          # source, the lava/water mixing product, the bubble column, the
          # waterlogged chest). The VERDICT line is the gated contract.
          mkdir -p run5 && pushd run5 >/dev/null
          set +e
          timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" \
            env WGPU_BACKEND=Vulkan E2E_FLUIDS=1 \
            "../$BIN_NAME" --smoke 2>&1 | tee ../smoke-fluids.log
          CODE=$?
          set -e
          popd >/dev/null
          echo "fluids smoke exit code: $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "FAIL: fluids E2E exited $CODE"
            exit 1
          fi
          grep -q "e2e: fluids VERDICT OK" smoke-fluids.log || { echo "FAIL: the fluids E2E verdict is not OK (the flags line above shows which scenario failed)"; exit 1; }
          echo "FLUIDS OK - the fluid rules verified in-game (the infinite source, the mixing product, the bubble column, the waterlogged chest)"

          # 1.1v: runtime phase-meter proof (E2E_PHASES=1) — min over the
          # live ring of sum(phases)/frame must be >= 0.9 (the unit
          # test's contract through the REAL event loop); then the F3
          # overlay with the phase row is captured to screenshots/.
          mkdir -p run6 && pushd run6 >/dev/null
          set +e
          timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" \
            env WGPU_BACKEND=Vulkan E2E_PHASES=1 \
            "../$BIN_NAME" --smoke --verbose 2>&1 | tee ../smoke-phases.log
          CODE=$?
          set -e
          popd >/dev/null
          echo "phases smoke exit code: $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "FAIL: phases E2E exited $CODE"
            exit 1
          fi
          grep -q "e2e: phases .* VERDICT OK" smoke-phases.log || { echo "FAIL: the phases E2E verdict is not OK (the ring line above shows the coverage)"; exit 1; }
          grep -q "PHASES CONTRACT OK" smoke-phases.log || { echo "FAIL: the phases capture contract is not OK"; exit 1; }
          test -s run6/screenshots/e2e_phases_f3_*.png || { echo "FAIL: phases F3 screenshot missing"; exit 1; }
          echo "PHASES OK - the phase meter spans update+draw in-game (min coverage >= 0.9, F3 phase row captured)"

          # 1.11: solo-mob turntable (E2E_TURNTABLE=1, TURNTABLE_MOB=name,
          # default creeper) — one subject alone on flat grass, HUD hidden,
          # neutral daylight; front/side/back/three-quarter/close-up PNGs
          # to screenshots/. The PNGs are the owner's art verdicts (V1).
          mkdir -p run8 && pushd run8 >/dev/null
          set +e
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" \
            env WGPU_BACKEND=Vulkan E2E_TURNTABLE=1 \
            "../$BIN_NAME" --smoke --verbose 2>&1 | tee ../smoke-turntable.log
          CODE=$?
          set -e
          popd >/dev/null
          echo "turntable smoke exit code: $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "FAIL: turntable E2E exited $CODE"
            exit 1
          fi
          grep -q "TURNTABLE VERDICT OK" smoke-turntable.log || { echo "FAIL: the turntable E2E verdict is not OK"; exit 1; }
          for v in front side back threequarter closeup; do
            test -s run8/screenshots/e2e_turntable_*_${v}_*.png || { echo "FAIL: turntable ${v} screenshot missing"; exit 1; }
          done
          echo "TURNTABLE OK - solo-mob 5-view capture set saved"

          # Mob survey (E2E_MOBSURVEY=1) — every MobKind::all() entry gets
          # one front view on the turntable rig (same stage/camera/pull
          # contract). 66 PNGs to screenshots/; the PNGs are the owner's
          # per-mob art verdicts (V1). Count gate: 66 files.
          mkdir -p run9 && pushd run9 >/dev/null
          set +e
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" \
            env WGPU_BACKEND=Vulkan E2E_MOBSURVEY=1 \
            "../$BIN_NAME" --smoke --verbose 2>&1 | tee ../smoke-survey.log
          CODE=$?
          set -e
          popd >/dev/null
          echo "survey smoke exit code: $CODE"
          if [ "$CODE" -ne 0 ]; then
            echo "FAIL: mob survey E2E exited $CODE"
            exit 1
          fi
          grep -q "SURVEY VERDICT OK" smoke-survey.log || { echo "FAIL: the survey E2E verdict is not OK"; exit 1; }
          SURVEY_N=$(ls run9/screenshots/e2e_survey_*_front_*.png 2>/dev/null | wc -l)
          [ "$SURVEY_N" -eq 66 ] || { echo "FAIL: survey captured $SURVEY_N/66 mob views"; exit 1; }
          echo "SURVEY OK - all 66 mob front views saved"

          # 1.2v: streaming benchmark, NON-GATING — the orbit default stays
          # untouched; this leg walks fresh terrain (chunk gen + meshing in
          # the frame cost) and uploads its JSON. Never fails the job: the
          # numbers are evidence for the 1.10 verdict, not a gate.
          # Sizing (measured 2026-10-08): lavapipe software raster runs the
          # streaming walk at ~1.8 s/frame, so 150 frames + boot fit in the
          # 600 s timeout with margin; bigger matrices belong on real GPUs.
          mkdir -p run7 && pushd run7 >/dev/null
          set +e
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" \
            env WGPU_BACKEND=Vulkan \
            "../$BIN_NAME" --benchmark streaming frames=120 warmup=30 json=streaming-bench.json --gpu-timing --verbose 2>&1 | tee ../smoke-streaming.log
          CODE=$?
          set -e
          popd >/dev/null
          echo "streaming bench exit code: $CODE"
          test -s run7/streaming-bench.json && grep -q '"avg_ms"' run7/streaming-bench.json && echo "STREAMING JSON OK" || echo "WARN: streaming bench produced no usable JSON (non-gating, see smoke-streaming.log)"

          # 1.10: CI perf gate on the streaming JSON — structural only
          # (lavapipe timings are environment noise; thresholds would
          # flake). Fails on missing/malformed data; REPORTS avg/p99/max
          # (worst_ms) + chunks for the verdict. Owner hardware judges.
          python3 - <<'EOF' || { echo "FAIL: streaming perf gate (malformed JSON)"; exit 1; }
          import json, sys
          d = json.load(open("run7/streaming-bench.json"))["benchmark"]
          f, p, w = d["frame"], d["phases"]["phases_ms"], d.get("world", {})
          assert d["camera"] == "streaming", d["camera"]
          assert f["frames"] >= 100, f["frames"]
          for k in ("avg_ms", "median_ms", "p99_ms", "worst_ms"):
              assert isinstance(f[k], (int, float)) and f[k] > 0, k
          print(f"PERF GATE OK — frames={f['frames']} avg={f['avg_ms']:.1f} "
                f"median={f['median_ms']:.1f} p99={f['p99_ms']:.1f} "
                f"worst={f['worst_ms']:.1f}ms phases={p} world={w} "
                f"gpu_ms={d.get('gpu_ms')}")
          EOF

          echo "SMOKE OK — the single-file binary boots (intro → panorama title) and enters a world headless (lavapipe)"

      - name: Upload artifact (the raw executable, no archive)
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-linux-single-file
          path: voxelcraft-*-linux-x64
          retention-days: 90
          if-no-files-found: error

      - name: Upload phases F3 screenshot (1.1v V1 evidence)
