name: Build WASM

# Auto-builds the Rust engine to a browser-ready WASM bundle and uploads
# it as workflow ARTIFACTS (30-day retention).
#
# 2026-09-21 repo slim-down: the bundle is NEVER committed back to the
# repo anymore — the old commit-back loop pushed a ~6MB binary blob on
# every Rust change (171 versions ≈ 687MB of git history, most of the
# 130MB GitHub pack). The bundle for a deployed site is now built where
# it runs:
#   * locally:  voxelcraft/scripts/rebuild-web-bundle.sh (locked pair)
#   * CI:       the "voxelcraft-wasm-bundle" artifact from this workflow
# The re-trigger guard stays (Rust-source paths only).

on:
  push:
    branches: [main]
    paths:
      - 'voxelcraft/**'
      - '.github/workflows/wasm-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: cargo -> wasm-bindgen -> patch -> public/
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: voxelcraft
          key: wasm

      - name: Cache wasm-bindgen-cli
        id: cache_wbg
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-0.2.127-x86_64-unknown-linux-gnu

      - name: Install wasm-bindgen-cli (pinned to wasm-bindgen crate version)
        if: steps.cache_wbg.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Show toolchain
        run: |
          cargo --version
          rustc --version
          wasm-bindgen --version

      - name: Build release WASM
        working-directory: voxelcraft
        run: cargo build --release --target wasm32-unknown-unknown --lib

      - name: Generate JS glue
        working-directory: voxelcraft
        run: |
          wasm-bindgen --target web \
            --out-dir ./wasm-out \
            target/wasm32-unknown-unknown/release/voxelcraft.wasm

      - name: Patch JS glue (winit pointerType hardening)
        run: |
          python3 voxelcraft/patch-wasm-glue.py voxelcraft/wasm-out/voxelcraft.js || {
            echo "=== patch failed — dumping glue diagnostics ==="
            wc -c voxelcraft/wasm-out/voxelcraft.js
            echo "__wbg_ import count: $(grep -c '__wbg_' voxelcraft/wasm-out/voxelcraft.js || true)"
            echo "--- pointerType lines ---"
            grep -n "pointerType" voxelcraft/wasm-out/voxelcraft.js | head -6 || echo "(no pointerType anywhere)"
            echo "--- first __wbg_pointerType context (or first __wbg_) ---"
            grep -n -A4 "__wbg_pointerType" voxelcraft/wasm-out/voxelcraft.js | head -14 \
              || grep -n -A4 "__wbg_" voxelcraft/wasm-out/voxelcraft.js | head -14
            echo "--- file head (400 chars) ---"
            head -c 400 voxelcraft/wasm-out/voxelcraft.js
            exit 1
          }

      - name: Upload RAW glue (patch-debug aid)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-wasm-glue
          path: voxelcraft/wasm-out/voxelcraft.js
          retention-days: 7
          if-no-files-found: ignore

      - name: Deploy bundle to public/
        run: |
          cp voxelcraft/wasm-out/voxelcraft.js             public/voxelcraft.js
          cp voxelcraft/wasm-out/voxelcraft_bg.wasm        public/voxelcraft_bg.wasm
          cp voxelcraft/wasm-out/voxelcraft.d.ts           public/voxelcraft.d.ts
          cp voxelcraft/wasm-out/voxelcraft_bg.wasm.d.ts   public/voxelcraft_bg.wasm.d.ts
          # builtin resource pack (wasm fetches /voxelcraft-pack/** at boot)
          rm -rf public/voxelcraft-pack
          cp -r voxelcraft/builtin-pack public/voxelcraft-pack
          ls -la public/voxelcraft*
          find public/voxelcraft-pack -type f | head -20

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-wasm-bundle
          path: |
            public/voxelcraft.js
            public/voxelcraft_bg.wasm
            public/voxelcraft.d.ts
            public/voxelcraft_bg.wasm.d.ts
          retention-days: 30
          if-no-files-found: error

      - name: Upload builtin pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-builtin-pack
          path: voxelcraft/builtin-pack/**
          retention-days: 30
          if-no-files-found: error

      - name: Bundle summary (artifacts only — never committed)
        run: |
          echo "wasm bundle built and uploaded as workflow artifacts:"
          ls -la public/voxelcraft* 2>/dev/null || true
          echo "NOTE (2026-09-21 repo slim-down): the bundle is NOT committed"
          echo "anymore — 171 auto-committed rebuilds had grown the git pack to"
          echo "~130MB. Download the 'voxelcraft-wasm-bundle' artifact, or build"
          echo "locally with voxelcraft/scripts/rebuild-web-bundle.sh."

  native-check:
    name: cargo check (native, audio on)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ALSA headers (rodio/cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: voxelcraft
          key: native

      - name: cargo check (native)
        working-directory: voxelcraft
        run: cargo check --release

      - name: cargo test (native, headless-safe)
        working-directory: voxelcraft
        run: cargo test --release --no-default-features --features bench-bin

      - name: Headless CPU-pipeline benchmark (Phase-0 baseline, §37/§48)
        working-directory: voxelcraft
        run: |
          cargo run --release --no-default-features --features bench-bin --bin vc_bench -- \
            chunks=96 json=bench-headless.json
          echo "=== bench-headless.json ==="
          cat bench-headless.json

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: headless-bench
          path: voxelcraft/bench-headless.json
          retention-days: 90
          if-no-files-found: error
