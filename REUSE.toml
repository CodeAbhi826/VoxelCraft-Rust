# REUSE.toml — bulk license annotations (REUSE v1).
# Decisions: docs/AGENT-STATE.md licensing block (code GPL-3.0-or-later,
# builtin art CC-BY-SA-4.0, Monocraft OFL-1.1, Voxelfont MIT).
version = 1

[[annotations]]
path = "voxelcraft/**/*.rs"
precedence = "override"
SPDX-FileCopyrightText = "2026 CodeAbhi826 and contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "voxelcraft/**/*.wgsl"
precedence = "override"
SPDX-FileCopyrightText = "2026 CodeAbhi826 and contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "voxelcraft/scripts/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 CodeAbhi826 and contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "builtin-pack/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 CodeAbhi826 and contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "**/Monocraft.ttf"
precedence = "override"
SPDX-FileCopyrightText = "2022 Idrees Hassan"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "**/Voxelfont.ttf"
precedence = "override"
SPDX-FileCopyrightText = "2026 The VoxelCraft Project"
SPDX-License-Identifier = "MIT"
