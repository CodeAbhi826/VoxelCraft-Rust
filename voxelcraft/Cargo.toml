[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/voxelcraft"]

[workspace.package]
version = "0.3.0"
edition = "2021"
repository = "https://github.com/CodeAbhi826/VoxelCraft-Rust"

[workspace.dependencies]
# internal libraries — separately consumable, each published as its own
# release archive (NO all-in-one bundle)
vc-nbt = { path = "crates/vc-nbt" }
vc-blocks = { path = "crates/vc-blocks" }
vc-rng = { path = "crates/vc-rng" }
vc-chunk = { path = "crates/vc-chunk" }
vc-pack = { path = "crates/vc-pack" }
vc-inventory = { path = "crates/vc-inventory" }
vc-world = { path = "crates/vc-world" }
vc-mesh = { path = "crates/vc-mesh" }
vc-particles = { path = "crates/vc-particles" }
vc-gameplay = { path = "crates/vc-gameplay" }
vc-sim = { path = "crates/vc-sim" }
vc-anvil = { path = "crates/vc-anvil" }
vc-render = { path = "crates/vc-render" }
vc-audio = { path = "crates/vc-audio" }

# shared external versions
# 2026-09-21 perf round: mimalloc — the drop-in global allocator with
# consistent wins on alloc-heavy game loops (chunk meshing + worldgen);
# native-only (wasm keeps the system allocator)
mimalloc = "0.1"
# 2026-09-21b perf round: FxHash for every integer-keyed map (chunk
# coords / block coords) — the rustc's own compiler hasher; ~2-4x std
# SipHash on integer keys, no downside (keys are never attacker data).
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# WGSL validation of shader-pack sources at RUNTIME (§34/§46).
naga = { version = "22", features = ["wgsl-in", "glsl-in", "wgsl-out"] }
wgpu = "22"
winit = "0.29"
glam = "0.29"
pollster = "0.3"
rayon = "1.10"
flate2 = "1"
rodio = "0.19"
wasm-bindgen = { version = "=0.2.127" }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
web-sys = "0.3"
# std::time::Instant/SystemTime PANIC on wasm32-unknown-unknown ("time not
# implemented on this platform") even though they compile. web-time is the
# drop-in the whole wgpu ecosystem uses: std re-export on native,
# performance.now()/Date on wasm. Already in the tree via wgpu.
web-time = "0.2"

[profile.release]
# keep the engine's release profile at the workspace root
opt-level = 3
# 2026-09-21 perf round: fat LTO + single codegen unit — the classic
# zero-code-risk release win for game workloads (cross-crate inlining
# across the 15-crate graph: meshing/worldgen hot loops live in
# vc-mesh/vc-world but their callers in vc-render/voxelcraft inline
# through). Costs link time only; CI budgets already cover it.
lto = "fat"
codegen-units = 1
# single-file game releases (linux-game.yml) ship the raw binary —
# stripped symbols keep the download small; debug builds are unaffected
strip = true
