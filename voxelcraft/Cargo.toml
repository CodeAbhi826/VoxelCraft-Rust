[package]
name = "voxelcraft"
version = "0.1.0"
edition = "2021"
description = "High-performance Minecraft-1.16.5-style voxel engine in Rust + wgpu (native Vulkan/DX12/Metal + WebGPU/WASM)"

[lib]
name = "voxelcraft"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "voxelcraft"
path = "src/main.rs"

[[bin]]
name = "vc_bench"
path = "src/bin/vc_bench.rs"
required-features = ["bench-bin"]

[features]
default = ["audio"]
audio = ["dep:rodio"]
# opt-in native-only benchmark binary (uses rayon + std::fs + env args;
# not buildable for wasm32). Run: cargo run --release --features bench-bin --bin vc_bench
bench-bin = []

[dependencies]
winit = "0.29"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "22"
rodio = { version = "0.19", optional = true }
rayon = "1.10"
# Anvil save/load: zlib (type 2, what vanilla 1.16.5 writes) + gzip (type 1)
# region payloads. Default backend = pure-Rust miniz_oxide — wasm-safe too,
# but the save system itself is native-only (browser saves need OPFS later).
flate2 = "1"

[dev-dependencies]
# WGSL shader validation in unit tests (the FSR EASU/RCAS ports are big
# enough that runtime-only shader errors would be painful to debug);
# naga's `valid` module ships built-in, no feature needed
naga = { version = "22", features = ["wgsl-in"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "22", features = ["webgl"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Navigator",
    "Gpu",
    "AudioContext",
    "BaseAudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioNode",
    "AudioParam",
    "GainNode",
    "AudioDestinationNode",
    "StereoPannerNode",
    "Performance",
    "console",
    "Response",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.release.package."*"]
opt-level = 3
